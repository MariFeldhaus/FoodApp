<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was koche ich heute?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2;
    --warm-white: #FFFEF9;
    --ink: #1A1814;
    --muted: #8A8680;
    --border: #E8E4DC;
    --green: #2D6A4F;
    --green-light: #EAF4EE;
    --red-light: #FAEAEA;
    --red: #C0392B;
    --card-shadow: 0 2px 24px rgba(26,24,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 2rem 1.5rem 0;
    text-align: center;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  header h1 em {
    font-style: italic;
    color: var(--green);
  }

  header p {
    margin-top: .5rem;
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  #main {
    width: 100%;
    max-width: 440px;
    padding: 2rem 1.25rem 3rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* ---- Upload ---- */
  #upload-section { display: flex; flex-direction: column; gap: 1rem; }

  #input-tabs {
    display: flex;
    gap: .5rem;
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: .6rem;
    border: none;
    border-radius: 10px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }

  .tab-btn.active { background: var(--ink); color: var(--warm-white); }

  #ingredients-input, #notes-input {
    width: 100%;
    padding: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    background: var(--warm-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    resize: vertical;
  }
  #ingredients-input { min-height: 120px; }
  #notes-input { min-height: 70px; margin-top: .5rem; }
  #ingredients-input:focus, #notes-input:focus { outline: none; border-color: var(--green); }
  #ingredients-input::placeholder, #notes-input::placeholder { color: var(--muted); font-weight: 300; }

  #drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--warm-white);
    position: relative;
    overflow: hidden;
  }

  #drop-zone:hover { border-color: var(--green); background: var(--green-light); }
  #drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  #drop-zone .icon {
    width: 48px; height: 48px;
    margin: 0 auto .75rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
  }

  #drop-zone h3 { font-size: 15px; font-weight: 500; margin-bottom: .25rem; }
  #drop-zone p { font-size: 13px; color: var(--muted); font-weight: 300; }

  #preview-wrap { display: none; position: relative; }

  #preview-img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border-radius: 16px;
    display: block;
    border: 1px solid var(--border);
  }

  #change-btn {
    position: absolute;
    bottom: .75rem; right: .75rem;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(250,247,242,.9);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    backdrop-filter: blur(4px);
  }

  #analyze-btn {
    width: 100%;
    padding: .85rem;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: var(--warm-white);
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    display: none;
    letter-spacing: .01em;
  }
  #analyze-btn:hover { opacity: .88; }
  #analyze-btn:active { transform: scale(.98); }

  #error-msg {
    font-size: 13px;
    color: var(--red);
    text-align: center;
    padding: .5rem;
    display: none;
    background: var(--red-light);
    border-radius: 8px;
  }

  /* ---- Loading ---- */
  #loading {
    display: none;
    text-align: center;
    padding: 3rem 0;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading p { font-size: 14px; color: var(--muted); font-weight: 300; }

  /* ---- Results ---- */
  #results-area { display: none; flex-direction: column; gap: 1.25rem; }

  #share-row { display: flex; gap: .75rem; }

  #share-btn {
    flex: 1;
    padding: .85rem;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: var(--warm-white);
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    letter-spacing: .01em;
  }
  #share-btn:hover { opacity: .88; }
  #share-btn:active { transform: scale(.98); }

  #share-status {
    font-size: 12px;
    color: var(--green);
    text-align: center;
    display: none;
  }
  #share-status.error { color: var(--red); }

  #results-list { display: flex; flex-direction: column; gap: 1.25rem; }

  .recipe-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.75rem;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }

  .card-tag {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--green-light);
    color: var(--green);
    flex-shrink: 0;
  }

  .card-time {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    font-weight: 300;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -.01em;
  }

  .card-desc {
    font-size: 13.5px;
    line-height: 1.65;
    color: #4A4744;
    font-weight: 300;
    flex: 1;
  }

  .ing-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }

  .ingredients { display: flex; flex-wrap: wrap; gap: 6px; }

  .ing {
    font-size: 12px;
    padding: 3px 10px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: #5A5754;
    font-weight: 300;
  }

  /* ---- Voting ---- */
  .vote-row {
    display: flex;
    gap: .75rem;
    margin-top: .25rem;
  }

  .vote-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: .6rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .vote-btn.heart.active { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .vote-btn.x.active { background: var(--red-light); border-color: var(--red); color: var(--red); }

  #restart-btn {
    padding: .75rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s;
    margin-top: .5rem;
  }
  #restart-btn:hover { background: var(--warm-white); }

  /* ---- Recipe detail ---- */
  .recipe-link-btn {
    align-self: flex-start;
    font-size: 12px;
    font-weight: 500;
    color: var(--green);
    background: var(--green-light);
    border: none;
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  #recipe-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,24,20,.45);
    z-index: 10;
    align-items: flex-end;
    justify-content: center;
  }

  #recipe-modal-content {
    width: 100%;
    max-width: 440px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--warm-white);
    border-radius: 20px 20px 0 0;
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  #recipe-modal-close {
    align-self: flex-end;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    cursor: pointer;
  }

  .steps-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-top: .5rem;
  }

  #recipe-modal-steps {
    padding-left: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    font-size: 13.5px;
    line-height: 1.55;
    color: #4A4744;
    font-weight: 300;
  }
</style>
</head>
<body>

<header>
  <h1>Was koche ich <em>heute?</em></h1>
  <p>Foto machen · Rezepte entdecken · Teilen &amp; bewerten</p>
</header>

<div id="main">

  <!-- Upload -->
  <div id="upload-section">
    <div id="input-tabs">
      <button class="tab-btn active" id="tab-photo" onclick="switchTab('photo')">Foto</button>
      <button class="tab-btn" id="tab-text" onclick="switchTab('text')">Zutaten eingeben</button>
    </div>

    <div id="photo-tab">
      <div id="drop-zone">
        <input type="file" id="file-input" accept="image/*">
        <div class="icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="2" y="5" width="18" height="14" rx="2.5" stroke="#8A8680" stroke-width="1.3"/>
            <circle cx="8" cy="11" r="2" stroke="#8A8680" stroke-width="1.3"/>
            <path d="M2 16L7 11L10.5 14.5L14 11L20 16" stroke="#8A8680" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 2V6M14 4H18" stroke="#8A8680" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>Zutaten fotografieren</h3>
        <p>Kühlschrank, Einkauf oder Tisch — einfach tippen</p>
      </div>

      <div id="preview-wrap">
        <img id="preview-img" alt="Vorschau">
        <button id="change-btn" onclick="document.getElementById('file-input').click()">Bild ändern</button>
      </div>
    </div>

    <div id="text-tab" style="display:none;">
      <textarea id="ingredients-input" placeholder="Welche Zutaten hast du da? z.B. Hühnchenbrust, Zucchini, Reis, Karotten, Ingwer …"></textarea>
    </div>

    <div id="notes-wrap">
      <div class="ing-label">Wünsche (optional)</div>
      <textarea id="notes-input" placeholder="z.B. ich könnte noch einkaufen gehen, ich hätte gern etwas Frisches/einen Salat, oder ein bestimmtes Gericht …"></textarea>
    </div>

    <div id="error-msg"></div>
    <button id="analyze-btn" onclick="analyze()">Rezepte vorschlagen</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Zutaten werden erkannt…</p>
  </div>

  <!-- Results -->
  <div id="results-area">
    <div id="share-row">
      <button id="share-btn" onclick="shareSet()">Rezepte teilen</button>
    </div>
    <p id="share-status"></p>
    <div id="results-list"></div>
    <button id="restart-btn" onclick="restart()">Neue Zutaten / neues Foto</button>
  </div>

  <!-- Recipe detail -->
  <div id="recipe-modal">
    <div id="recipe-modal-content">
      <button id="recipe-modal-close" onclick="closeRecipe()">Schließen</button>
      <div class="card-title" id="recipe-modal-title"></div>
      <div class="card-desc" id="recipe-modal-desc"></div>
      <div class="ing-label">Zutaten</div>
      <div class="ingredients" id="recipe-modal-ingredients"></div>
      <div class="steps-label">Zubereitung</div>
      <ol id="recipe-modal-steps"></ol>
      <a id="recipe-modal-source" class="recipe-link-btn" target="_blank" rel="noopener noreferrer" style="display:none; text-decoration:none;"></a>
    </div>
  </div>

</div>

<script>
let recipes = [], voteCounts = [], currentSetId = null;
let imageBase64 = '', imageMime = 'image/jpeg';
let activeTab = 'photo';

const $ = id => document.getElementById(id);

$('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  imageMime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    imageBase64 = ev.target.result.split(',')[1];
    $('preview-img').src = ev.target.result;
    $('preview-wrap').style.display = 'block';
    $('drop-zone').style.display = 'none';
    $('analyze-btn').style.display = 'block';
    $('error-msg').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

function switchTab(tab) {
  activeTab = tab;
  $('tab-photo').classList.toggle('active', tab === 'photo');
  $('tab-text').classList.toggle('active', tab === 'text');
  $('photo-tab').style.display = tab === 'photo' ? 'block' : 'none';
  $('text-tab').style.display = tab === 'text' ? 'block' : 'none';
  $('error-msg').style.display = 'none';
  $('analyze-btn').style.display = tab === 'text' ? 'block' : (imageBase64 ? 'block' : 'none');
}

const loadingStepsPhoto = [
  'Zutaten werden erkannt…',
  'Rezeptideen werden entwickelt…',
  'Echte Rezepte werden im Web gesucht…',
  'Zubereitung wird zusammengestellt…'
];

const loadingStepsText = [
  'Rezeptideen werden entwickelt…',
  'Echte Rezepte werden im Web gesucht…',
  'Zubereitung wird zusammengestellt…'
];

async function analyze() {
  const ingredients = $('ingredients-input').value.trim();
  if (activeTab === 'photo' && !imageBase64) return;
  if (activeTab === 'text' && !ingredients) return;

  $('upload-section').style.display = 'none';
  $('loading').style.display = 'flex';

  const loadingSteps = activeTab === 'photo' ? loadingStepsPhoto : loadingStepsText;
  $('loading-text').textContent = loadingSteps[0];
  let step = 0;
  const interval = setInterval(() => {
    $('loading-text').textContent = loadingSteps[++step % loadingSteps.length];
  }, 1800);

  const notes = $('notes-input').value.trim();

  try {
    const body = activeTab === 'photo'
      ? { image: imageBase64, mimeType: imageMime, notes }
      : { ingredients, notes };

    const res = await fetch('/api/rezepte', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    clearInterval(interval);
    if (!res.ok) throw new Error('Server-Fehler: ' + res.status);

    recipes = await res.json();
    $('loading').style.display = 'none';
    await createSet();
    renderResults();

  } catch (err) {
    clearInterval(interval);
    $('loading').style.display = 'none';
    $('upload-section').style.display = 'flex';
    const em = $('error-msg');
    em.textContent = 'Fehler: ' + (err.message || 'Bitte nochmal versuchen.');
    em.style.display = 'block';
  }
}

function renderResults() {
  const list = $('results-list');
  list.innerHTML = '';
  recipes.forEach((r, idx) => list.appendChild(makeCard(r, idx)));
  $('results-area').style.display = 'flex';
}

function makeCard(r, idx) {
  const d = document.createElement('div');
  d.className = 'recipe-card';
  d.dataset.idx = idx;
  const counts = voteCounts[idx] || { heart: 0, x: 0 };
  const myVote = getMyVote(idx);
  d.innerHTML = `
    <div class="card-header">
      <span class="card-tag">${r.category}</span>
      <span class="card-time">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="#8A8680" stroke-width="1"/><path d="M6 3V6L8 7.5" stroke="#8A8680" stroke-width="1" stroke-linecap="round"/></svg>
        ${r.time} Min.
      </span>
    </div>
    <div class="card-title">${r.title}</div>
    <div class="card-desc">${r.description}</div>
    <div class="ing-label">Zutaten</div>
    <div class="ingredients">${r.ingredients.map(i => `<span class="ing">${i}</span>`).join('')}</div>
    <button class="recipe-link-btn" onclick="showRecipe(${idx})">Zubereitung ansehen</button>
    <div class="vote-row">
      <button class="vote-btn heart ${myVote === 'heart' ? 'active' : ''}" onclick="vote(${idx}, 'heart')">❤️ <span>${counts.heart}</span></button>
      <button class="vote-btn x ${myVote === 'x' ? 'active' : ''}" onclick="vote(${idx}, 'x')">❌ <span>${counts.x}</span></button>
    </div>
  `;
  return d;
}

function getMyVote(idx) {
  return currentSetId ? localStorage.getItem(`vote_${currentSetId}_${idx}`) : null;
}

async function createSet() {
  voteCounts = recipes.map(() => ({ heart: 0, x: 0 }));
  try {
    const res = await fetch('/api/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipes })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
    currentSetId = data.id;
    history.replaceState(null, '', `${location.pathname}?set=${currentSetId}`);
  } catch (err) {
    currentSetId = null;
    showStatus('Teilen/Bewerten ist gerade nicht verfügbar: ' + (err.message || 'Unbekannter Fehler'), true);
  }
}

function showStatus(text, isError) {
  const status = $('share-status');
  status.textContent = text;
  status.classList.toggle('error', !!isError);
  status.style.display = 'block';
  if (!isError) setTimeout(() => { status.style.display = 'none'; }, 2000);
}

async function vote(idx, type) {
  if (!currentSetId) {
    showStatus('Bewerten geht erst, sobald das Set gespeichert ist (siehe Hinweis oben).', true);
    return;
  }
  const key = `vote_${currentSetId}_${idx}`;
  const prevVote = localStorage.getItem(key);
  const newVote = prevVote === type ? null : type;

  try {
    const res = await fetch('/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentSetId, recipeIndex: idx, prevVote, vote: newVote })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
    voteCounts = data.votes;
    if (newVote) localStorage.setItem(key, newVote); else localStorage.removeItem(key);
    renderResults();
  } catch (err) {
    showStatus('Bewertung konnte nicht gespeichert werden: ' + (err.message || 'Unbekannter Fehler'), true);
  }
}

async function shareSet() {
  if (!currentSetId) {
    showStatus('Teilen geht erst, sobald das Set gespeichert ist (siehe Hinweis oben).', true);
    return;
  }
  const url = `${location.origin}${location.pathname}?set=${currentSetId}`;

  if (navigator.share) {
    try {
      await navigator.share({ title: 'Rezeptvorschläge', text: 'Schau dir diese Rezeptvorschläge an und bewerte sie!', url });
    } catch (err) {
      // Teilen abgebrochen, nichts zu tun
    }
  } else {
    await navigator.clipboard.writeText(url);
    showStatus('Link kopiert!', false);
  }
}

function showRecipe(idx) {
  const r = recipes[idx];
  $('recipe-modal-title').textContent = r.title;
  $('recipe-modal-desc').textContent = r.description;
  $('recipe-modal-ingredients').innerHTML = r.ingredients.map(i => `<span class="ing">${i}</span>`).join('');
  $('recipe-modal-steps').innerHTML = (r.steps || []).map(s => `<li>${s}</li>`).join('');

  const source = $('recipe-modal-source');
  if (r.sourceUrl) {
    source.href = r.sourceUrl;
    source.textContent = 'Original-Rezept ansehen' + (r.sourceName ? ` (${r.sourceName})` : '');
    source.style.display = 'inline-block';
  } else {
    source.style.display = 'none';
  }

  $('recipe-modal').style.display = 'flex';
}

function closeRecipe() {
  $('recipe-modal').style.display = 'none';
}

function restart() {
  recipes = []; voteCounts = []; currentSetId = null; imageBase64 = '';
  $('results-area').style.display = 'none';
  $('preview-wrap').style.display = 'none';
  $('drop-zone').style.display = 'block';
  $('analyze-btn').style.display = 'none';
  $('error-msg').style.display = 'none';
  $('file-input').value = '';
  $('ingredients-input').value = '';
  $('notes-input').value = '';
  history.replaceState(null, '', location.pathname);
  switchTab('photo');
  $('upload-section').style.display = 'flex';
}

(async function init() {
  const setId = new URLSearchParams(location.search).get('set');
  if (!setId) return;

  try {
    const res = await fetch(`/api/set?id=${encodeURIComponent(setId)}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
    recipes = data.recipes;
    voteCounts = data.votes;
    currentSetId = setId;
    $('upload-section').style.display = 'none';
    renderResults();
  } catch (err) {
    history.replaceState(null, '', location.pathname);
    const em = $('error-msg');
    em.textContent = 'Geteiltes Rezept-Set konnte nicht geladen werden: ' + (err.message || 'Unbekannter Fehler');
    em.style.display = 'block';
  }
})();
</script>
</body>
</html>
